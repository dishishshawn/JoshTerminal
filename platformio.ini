; ESP32-2432S028R "Cheap Yellow Display" (micro-USB, ILI9341, XPT2046, CH340)
; Firmware: stock/crypto ticker from https://github.com/MaWe88/esp32-cyd-ticker (GPL-3.0)
[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
extra_scripts = pre:scripts/compiledb.py
; 1.3 MB background image + LVGL + TLS doesn't fit the default 1.2 MB app slot
board_build.partitions = huge_app.csv
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    ; registry release lacks begin(SPIClass&), needed for the CYD's separate touch bus
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    ; upstream code uses the LVGL 8 API (lv_disp_drv_t); v9 renamed it
    lvgl/lvgl@~8.3.11
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7
build_flags =
    ; lv_conf.h lives in include/
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    ; TFT_eSPI config, mirrored from upstream User_Setup.h instead of editing the library
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DTOUCH_CS=33
    -DCGRAM_OFFSET
    -DSUPPORT_TRANSACTIONS
    -DTFT_MISO_READ
    ; this panel is BGR (upstream board was RGB): red and blue were swapped
    -DTFT_RGB_ORDER=TFT_BGR
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=27000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
